name: MATRIX Mobile Preview

on:
  push:
    branches: [master]
    paths:
      - 'preview/**'
      - 'scripts/3d/**'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: matrix-pages-preview
  cancel-in-progress: true

jobs:
  publish:
    name: Publish static mobile preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check preview/app.js
          node --check preview/catalog.js
          node --check preview/3d-page.js
      - name: Validate required static assets
        shell: bash
        run: |
          test -s preview/index.html
          test -s preview/style.css
          test -s preview/app.js
          test -s preview/catalog.js
          test -s preview/favicon.svg
          test -s preview/3d.html
          test -s preview/3d.css
          test -s preview/3d-page.js
          test -s preview/models/hilton-2-draft.glb
          grep -q 'id="product-dialog"' preview/index.html
          grep -q 'id="dialog-contact"' preview/index.html
      - name: Build distinct concept GLBs for catalog items with dimensions (no AR)
        run: |
          python3 scripts/3d/build_catalog_concepts.py
          python3 scripts/3d/test_catalog_concepts.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

