name: MATRIX Storefront Checks
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'preview/**'
      - 'scripts/3d/**'
      - '.github/workflows/storefront-checks.yml'
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'preview/**'
      - 'scripts/3d/**'
      - '.github/workflows/storefront-checks.yml'
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/3d/requirements.txt
      - run: python scripts/3d/build_catalog_models.py --sync-web
      - run: npm run build
        working-directory: apps/web
      - name: Validate preview and AR policy
        run: |
          node --check preview/app.js
          node --check preview/3d-page.js
          node --check preview/ar-launcher.js
          node scripts/3d/test_ar_policy.cjs
          node scripts/3d/test_product_ar.cjs

