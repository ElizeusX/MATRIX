name: CI
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: matrix
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: matrix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matrix -d matrix_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MATRIX_TEST_DATABASE_URL: postgres://matrix:ci-only-password@localhost:5432/matrix_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - run: cd services/api && go mod tidy
      - run: python3 scripts/3d/build_catalog_concepts.py
      - run: python3 scripts/3d/test_catalog_concepts.py
      - run: cd services/api && go test ./...
      - run: cd services/api && go vet ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd apps/web && npm ci
      - run: cd apps/web && npm run lint && npm run build

  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install numpy Pillow usd-core
      - run: python scripts/3d/test_hilton2_draft.py
      - run: node scripts/3d/test_ar_policy.cjs
      - run: npm ci --prefix apps/web
      - run: npm install --prefix /tmp/matrix-browser playwright@1.56.1
      - run: /tmp/matrix-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Mobile and desktop 3D smoke tests
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/matrix-preview.log 2>&1 &
          NODE_PATH=/tmp/matrix-browser/node_modules node scripts/3d/test_preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hilton2-browser-review
          path: artifacts/3d/browser-*.png
